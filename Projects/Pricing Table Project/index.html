<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <div class="table1">
            <h2>Basic</h2>
            <h1><b>$11.99/month</b></h1><br>
            <p>✅10GB Storage</p>
            <p>✅1 user</p>
            <p>🚫Support</p>
            <button>Sign Up</button>
        </div>
        <div class="table2">
            <h2>Standard</h2>
            <h1><b>$19.99/month</b></h1><br>
            <p>✅100GB Storage</p>
            <p>✅5 users</p>
            <p>✅Support</p>
            <button>Sign Up</button>
        </div>
        <div class="table3">
            <h2>Premium</h2>
            <h1><b>$49.99/month</b></h1><br>
            <p>✅1TB Storage</p>
            <p>✅Unlimited users</p>
            <p>✅Support</p>
            <button>Sign Up</button>
        </div>
    </div>
</body>
</html>
